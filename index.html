<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Minimal HABIT · makehabit.in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="styles.css">

<body>
<div id="loader" aria-hidden="true">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="rec" id="recbar"></div>

  </div>
</div>
<div id="wipe" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="ann" id="ann" aria-live="polite"></div>

<header class="hdr" id="hdr">
  <div class="wrap">
    <button class="icon-btn burger" id="burger" aria-label="Open menu"><svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M1 1h16M1 6h16M1 11h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <a href="#home" class="logo" aria-label="Dr Aneet's HABIT home"><span class="hand">Dr Aneet's</span><svg class="wm" viewBox="144.2 105 311.8 80" aria-hidden="true"></svg></a>
    <nav class="nav" aria-label="Main">
      <button id="shopBtn" aria-expanded="false" aria-controls="mega">Shop ▾</button>
      <a href="#recipes">Recipes</a>
      <a href="#club"><svg class="wm hm" viewBox="144.2 105 311.8 80" role="img" aria-label="HABIT"></svg> Club</a>
      <a href="#hamper">Make your own hamper</a>
      <a href="#subscriptions">Subscriptions</a>
      <a href="#gifting">Gifting</a>
      <a href="#about">About us</a>
    </nav>
    <div class="hdr-r">
      <a class="icon-btn" href="#shop" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></a>
      <button class="icon-btn" id="cartBtn" aria-label="Open cart"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="cart-n" id="cartN">0</span></button>
    </div>
  </div>
  <div class="mega" id="mega"></div>
</header>

<nav class="mnav" id="mnav" aria-label="Mobile menu"></nav>

<main id="view" tabindex="-1"></main>

<footer class="foot" id="foot"></footer>

<div id="scrim"></div>
<aside id="cart" aria-label="Your cart"></aside>
<div class="satc" id="satc"></div>
<div class="modal" id="spin" role="dialog" aria-modal="true" aria-labelledby="spinT"></div>
<div id="toast" role="status"><span class="mini"></span><span id="toastT">Added</span></div>

<script src="data.js"></script>
<script src="recipes.js"></script>
<script src="app.js"></script>
